name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package.json, such as v1.6.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          ATBE_EXTENSION_DIR: test-results/release/automatic-twitch-manifest-v3
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256
          --verify-tag --latest
          --title "Automatic Twitch (Manifest V3) $RELEASE_TAG"
          --notes-file docs/release-notes.md
