      <text x="82" y="196" fill="#a6a0ba" font-size="12">Bonus collected. Back to the stream.</text>
      <path d="M376 175L383 182L395 169" fill="none" stroke="#8ce2bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
