<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Automatic Twitch — rewards on autopilot</title>
  <desc id="desc">Watch the stream. Let Automatic Twitch claim earned Drops and bonus Channel Points.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211b3e"/><stop offset="1" stop-color="#0d111a"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#bcabff"/><stop offset="1" stop-color="#9476ed"/></linearGradient>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1090" cy="170" r="245" fill="none" stroke="#b39aff" stroke-opacity=".06"/>
  <circle cx="1090" cy="170" r="175" fill="none" stroke="#b39aff" stroke-opacity=".06"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
