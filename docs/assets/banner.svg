      <circle cx="341" cy="30" r="4" fill="#8ce2bd"/>
      <text x="353" y="35" fill="#8ce2bd" font-size="12">Enabled</text>
      <path d="M0 54H438" stroke="#3c3659"/>
      <rect x="20" y="73" width="398" height="63" rx="10" fill="#29253f"/>
      <path d="M42 92H60V97H65V106H60V120H42V106H37V97H42ZM38 106H64M51 92V120" fill="none" stroke="#bba5ff" stroke-width="2" stroke-linejoin="round"/>
      <text x="82" y="100" fill="#ebe4ff" font-size="15" font-weight="600">Twitch Drop</text>
